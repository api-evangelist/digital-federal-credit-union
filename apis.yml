name: DCU (Digital Federal Credit Union)
kind: company
description: >-
  Digital Federal Credit Union (DCU) is a not-for-profit, member-owned federal
  credit union headquartered in Marlborough, Massachusetts and regulated by the
  National Credit Union Administration (NCUA), with roughly 1.18 million members,
  23 branches across Massachusetts and New Hampshire, and nationwide access via
  the Co-Op shared-branch and surcharge-free ATM networks. It offers consumer and
  business banking, lending, mortgages, credit cards, and investment services, and
  has recently merged with First Technology Federal Credit Union. Like most US
  credit unions, DCU publishes NO public first-party developer API, developer
  portal, or downloadable OpenAPI/Swagger specifications; consumer-permissioned
  account data is reached only indirectly through third-party aggregators (Plaid,
  MX, Finicity, Akoya) and its core banking provider, and there is no publicly
  documented FDX participation or CFPB Section 1033 data-access program. This is an
  honest identity-only record: no public API surface exists to catalog.
